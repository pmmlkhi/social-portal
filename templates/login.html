<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لاگ اِن — سوشل میڈیا پورٹل</title>
<style>
body{font-family:system-ui,Tahoma,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;border-radius:12px;padding:32px;width:340px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h2{color:#14532d;margin-bottom:16px;text-align:center}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccd0d5;border-radius:8px;font-size:1em;box-sizing:border-box}
button{width:100%;background:#14532d;color:#fff;border:none;border-radius:8px;padding:12px;font-size:1em;cursor:pointer;margin-top:8px}
.err{background:#f8d7da;color:#721c24;padding:10px;border-radius:8px;margin-bottom:10px;font-size:.9em}
</style>
</head>
<body>
<div class="card">
<h2>سوشل میڈیا پورٹل</h2>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post">
<input type="password" name="password" placeholder="پاس ورڈ" autofocus>
<button type="submit">داخل ہوں</button>
</form>
</div>
</body>
</html>
